<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | OK Campaign</title>
  <meta name="description" content="Hon. Oluwadara Kehinde (Akan) — NDC Candidate Yewa North/Imeko-Afon 2027." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { navy: { DEFAULT:'#0A1628', dark:'#060d18', light:'#132337', mid:'#1a2d4a' },
                brand: { red:'#C41E3A', green:'#008751', gold:'#f59e0b' } },
      fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
    }}}
  </script>
  <style>
    html { scroll-behavior: smooth; }
    .nav-scrolled { background: rgba(10,22,40,0.97); backdrop-filter: blur(12px); }
    .gallery-caption { background: linear-gradient(transparent, rgba(10,22,40,0.92)); }
  </style>
</head>
<body class="font-sans text-slate-800 bg-slate-50 antialiased min-h-screen flex flex-col">
  <header id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-navy/95">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 md:h-20">
        <a href="index.html" class="flex items-center gap-3">
          <img src="/assets/ndc-logo.png" alt="NDC" class="h-10 w-10 object-contain rounded-full bg-white p-0.5" onerror="this.style.display='none'" />
          <div class="leading-tight">
            <span class="block text-white font-bold text-lg">OK is Okay</span>
            <span class="block text-brand-green text-xs font-medium">Oluwadara Kehinde</span>
          </div>
        </a>
        <nav class="hidden lg:flex items-center gap-5">
          <a href="index.html" class="text-white/90 hover:text-white font-medium text-sm">Home</a>
          <a href="index.html#about" class="text-white/90 hover:text-white font-medium text-sm">About</a>
          <a href="tasks.html" class="text-white/90 hover:text-white font-medium text-sm">Daily Tasks</a>
          <a href="gallery.html" class="text-white/90 hover:text-white font-medium text-sm">Gallery</a>
          <a href="news.html" class="text-white/90 hover:text-white font-medium text-sm">News</a>
          <a href="index.html#join" class="inline-flex px-4 py-2 rounded-full bg-brand-red hover:bg-red-700 text-white font-semibold text-sm">Volunteer</a>
        </nav>
        <button id="menuBtn" class="lg:hidden text-white p-2" aria-label="Menu">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
    <div id="mobileMenu" class="hidden lg:hidden bg-navy border-t border-white/10">
      <div class="px-4 py-4 space-y-2">
        <a href="index.html" class="block text-white py-2">Home</a>
        <a href="index.html#about" class="block text-white py-2">About</a>
        <a href="tasks.html" class="block text-white py-2">Daily Tasks</a>
        <a href="gallery.html" class="block text-white py-2">Gallery</a>
        <a href="news.html" class="block text-white py-2">News</a>
        <a href="index.html#join" class="block text-center mt-2 px-5 py-3 rounded-full bg-brand-red text-white font-semibold">Volunteer</a>
      </div>
    </div>
  </header>
  <main class="pt-24 pb-16 flex-1">
    <div class="max-w-5xl mx-auto px-4 sm:px-6">
      <div class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-extrabold text-navy mb-2">Campaign Gallery</h1>
        <div class="w-20 h-1.5 bg-brand-red mx-auto rounded-full mb-3"></div>
        <p class="text-slate-600">Moments from the movement · Auto-plays</p>
      </div>
      <div class="relative rounded-2xl overflow-hidden shadow-2xl bg-navy aspect-[16/10] md:aspect-[16/9]">
        <div id="slideContainer" class="absolute inset-0"></div>
        <div class="gallery-caption absolute bottom-0 left-0 right-0 p-5 md:p-8 text-white z-10">
          <p id="caption" class="text-lg md:text-2xl font-semibold"></p>
          <p id="counter" class="text-white/60 text-sm mt-1"></p>
        </div>
        <button id="prevBtn" class="absolute left-3 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-black/40 hover:bg-black/60 text-white z-10 text-2xl">‹</button>
        <button id="nextBtn" class="absolute right-3 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-black/40 hover:bg-black/60 text-white z-10 text-2xl">›</button>
        <div id="dots" class="absolute bottom-20 md:bottom-24 left-0 right-0 flex justify-center gap-2 z-10 flex-wrap px-4"></div>
      </div>
    </div>
  </main>
  <footer class="bg-navy-dark border-t border-white/10 py-10 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <p class="text-xl font-extrabold text-white mb-2">OK is Okay | NDC is Okay | Nigeria will be Okay</p>
      <p class="text-white/50 text-sm">Hon. Oluwadara Kehinde (Akan) — Yewa North / Imeko-Afon 2027</p>
    </div>
  </footer>
  <script>
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    if (menuBtn) menuBtn.addEventListener('click', () => mobileMenu.classList.toggle('hidden'));
    if (mobileMenu) mobileMenu.querySelectorAll('a').forEach(l => l.addEventListener('click', () => mobileMenu.classList.add('hidden')));
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (navbar) {
        if (window.scrollY > 40) navbar.classList.add('nav-scrolled', 'shadow-lg');
        else navbar.classList.remove('nav-scrolled', 'shadow-lg');
      }
    });
    let items = [], idx = 0, timer = null;
    function isVideo(f) { return /\.(mp4|webm|ogg)$/i.test(f); }
    function show(i) {
      if (!items.length) return;
      idx = (i + items.length) % items.length;
      const item = items[idx];
      const box = document.getElementById('slideContainer');
      const src = '/gallery/' + encodeURIComponent(item.file);
      if (isVideo(item.file)) {
        box.innerHTML = '<video src="'+src+'" class="w-full h-full object-cover" autoplay muted loop playsinline></video>';
      } else {
        box.innerHTML = '<img src="'+src+'" alt="" class="w-full h-full object-cover" onerror="this.style.opacity=0.3" />';
      }
      document.getElementById('caption').textContent = item.caption || item.file.replace(/\.[^.]+$/, '');
      document.getElementById('counter').textContent = (idx+1) + ' / ' + items.length;
      document.querySelectorAll('#dots button').forEach((d, di) => {
        d.className = 'w-2.5 h-2.5 rounded-full ' + (di === idx ? 'bg-white scale-125' : 'bg-white/40');
      });
    }
    function resetTimer() {
      clearInterval(timer);
      timer = setInterval(() => show(idx + 1), 5000);
    }
    document.getElementById('nextBtn').onclick = () => { show(idx+1); resetTimer(); };
    document.getElementById('prevBtn').onclick = () => { show(idx-1); resetTimer(); };
    async function load() {
      try {
        const res = await fetch('/gallery/gallery.json?_=' + Date.now());
        items = await res.json();
      } catch (e) { items = []; }
      if (!items.length) {
        document.getElementById('slideContainer').innerHTML = '<div class="flex items-center justify-center h-full text-white/70 p-8 text-center">No photos in gallery.json yet.</div>';
        return;
      }
      const dots = document.getElementById('dots');
      dots.innerHTML = items.map((_, i) => '<button type="button"></button>').join('');
      dots.querySelectorAll('button').forEach((b, i) => b.onclick = () => { show(i); resetTimer(); });
      show(0); resetTimer();
    }
    load();
  </script>
</body>
</html>
